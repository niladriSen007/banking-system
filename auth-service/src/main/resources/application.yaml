spring:
  application:
    name: auth-service
#  flyway:
#    enabled: true
#    locations: classpath:db/migrations
#    baseline-on-migrate: true
#    validate-on-migrate: true
#    default-schema: banking
#    schemas: banking
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: banking
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
jwt:
  issuer: banking-auth-service
  audience: banking-api
  clock-skew-seconds: 30

  # LOCAL DEVELOPMENT ONLY
  private-key-location: classpath:private-key.pem
  public-key-location: classpath:public-key.pem

  access-token-expiration-seconds: 900

server:
  port: 5002

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10 # The interval at which the Eureka client sends heartbeats to the Eureka server to renew its lease.
    lease-expiration-duration-in-seconds: 30 # The duration after which the Eureka server considers the instance as expired if it doesn't receive a heartbeat.