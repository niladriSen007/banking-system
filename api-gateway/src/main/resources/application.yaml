spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/v1/transaction/**
#              filters:
#                - StripPrefix=2
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/v1/accounts/**
  main:
    allow-bean-definition-overriding: true

server:
  port: 4000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

jwt:
  issuer: banking-auth-service
  audience: banking-api

  # Keep this outside the application JAR in production.
  public-key-location: classpath:public-key.pem

  # 15 minutes
  clock-skew-seconds: 30

  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/signup
    - /api/v1/auth/register
    - /api/v1/actuator/health



